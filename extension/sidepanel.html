<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Indify</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --panel-bg: #ffffff;
      --border: #e5e7eb;
      --text: #1f2937;
      --muted: #6b7280;
      --ok: #16a34a;
      --off: #9ca3af;
      --warn: #d97706;
      --err: #dc2626;
      --accent: #2563eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border);
      padding: 10px 12px;
    }
    .brand {
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }
    .dot-ok { background: var(--ok); }
    .dot-off { background: var(--off); }
    .status-row span:last-child { font-size: 12px; color: var(--muted); }
    #context-text {
      font-size: 12px;
      color: var(--muted);
      word-break: break-all;
    }
    #token-box {
      display: none;
      margin-top: 8px;
    }
    #token-box.show { display: block; }
    #token-input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      font-family: monospace;
    }
    #token-save {
      margin-top: 6px;
      font-size: 12px;
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
    }
    .hint {
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
      line-height: 1.6;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .placeholder {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
      margin-top: 32px;
    }
    .msg { display: flex; }
    .msg.user { justify-content: flex-end; }
    .msg.system { justify-content: center; }
    .msg .bubble {
      max-width: 85%;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.5;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .msg.user .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
    .msg.system .bubble {
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      padding: 2px 8px;
    }
    .card {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      font-size: 13px;
    }
    .card .task-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .card .task-status .s-done { color: var(--ok); }
    .card .task-status .s-failed { color: var(--err); }
    .card .task-status .s-running { color: var(--accent); }
    .card .task-status .s-wait { color: var(--warn); }
    .progress {
      height: 6px;
      background: #eef0f3;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .progress .bar {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      transition: width 0.3s ease;
    }
    .progress .bar.bar-done { background: var(--ok); }
    .progress .bar.bar-failed { background: var(--err); }
    .task-summary {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      margin-bottom: 8px;
      word-break: break-word;
    }
    .task-error {
      color: var(--err);
      font-size: 12px;
      margin-bottom: 8px;
      word-break: break-all;
    }
    .preview {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
      background: #fafbfc;
    }
    .preview .p-title { font-weight: 600; margin-bottom: 4px; }
    .preview .p-meta { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    .preview .p-nodes { font-size: 12px; }
    .preview .p-nodes ul { margin: 4px 0 0; padding-left: 18px; }
    .preview .p-nodes li { margin: 2px 0; }
    .preview .p-loading { color: var(--muted); font-size: 12px; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
    button.btn {
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #fff;
      cursor: pointer;
    }
    button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.btn.danger { color: var(--err); border-color: var(--err); }
    button.btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .revise-box {
      display: none;
      margin-top: 10px;
    }
    .revise-box.show { display: block; }
    .revise-box textarea {
      width: 100%;
      min-height: 56px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      resize: vertical;
      margin-bottom: 8px;
    }
    .plan-box {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      background: #fafbfc;
      margin-bottom: 4px;
    }
    .plan-hint {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
      line-height: 1.5;
    }
    #plan-input {
      width: 100%;
      min-height: 180px;
      max-height: 340px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      line-height: 1.6;
      resize: vertical;
      font-family: inherit;
      color: var(--text);
      background: #fff;
    }
    .agent-output {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      background: #101418;
      color: #d1d5db;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Courier New", monospace;
      font-size: 11px;
      line-height: 1.55;
      max-height: 200px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 8px;
    }
    .agent-output .ao-hint {
      color: #9ca3af;
      font-size: 10px;
      font-style: italic;
    }
    .agent-output .ao-tool {
      color: #93c5fd;
      font-size: 10px;
    }
    .result-link {
      margin-top: 4px;
    }
    .result-link a {
      color: var(--accent);
      text-decoration: none;
      cursor: pointer;
      font-size: 12px;
    }
    .result-link a:hover { text-decoration: underline; }
    .session-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 6px;
      padding-top: 8px;
      border-top: 1px dashed var(--border);
    }
    .session-row span { font-size: 12px; color: var(--muted); }
    footer {
      background: var(--panel-bg);
      border-top: 1px solid var(--border);
      padding: 10px 12px;
    }
    #mode-hint {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .composer {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    #chat-input {
      flex: 1;
      min-height: 40px;
      max-height: 120px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      resize: none;
      color: var(--text);
    }
    #send-btn {
      height: 40px;
      padding: 0 16px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 13px;
      cursor: pointer;
    }
    #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <div class="brand">Indify</div>
    <div class="status-row">
      <span id="bridge-dot" class="dot dot-off"></span>
      <span id="bridge-text">Bridge 未连接</span>
    </div>
    <div id="context-text">未检测到 Dify 页面(请打开 http://localhost)</div>
    <div id="token-box">
      <input id="token-input" type="password" placeholder="粘贴 Bridge token(.indifyrc.yaml 的 token 值)">
      <button id="token-save">保存并重连</button>
      <div class="hint">Bridge 在 ws://127.0.0.1:39181 运行;token 只保存在本机 chrome.storage.local。</div>
    </div>
  </header>

  <main id="messages">
    <div id="user-messages"></div>
    <div id="task-card"></div>
    <div id="empty-hint" class="placeholder">
      输入需求,生成或修改你的 Dify 工作流。<br>
      例如:「做一个客服工单分类工作流,按情绪和主题分派」。
    </div>
  </main>

  <footer>
    <div id="mode-hint">将新建工作流</div>
    <div class="composer">
      <textarea id="chat-input" placeholder="描述你想要的工作流或修改…(Enter 发送,Shift+Enter 换行)"></textarea>
      <button id="send-btn">发送</button>
    </div>
  </footer>

  <script src="sidepanel.js"></script>
</body>
</html>
